name: Auto-Build Custom Caddy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: airopi/caddy-l4

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.caddy_version.outputs.version }}
      build_needed: ${{ steps.check_image.outputs.build_needed }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get latest Caddy version from Docker Hub
        id: caddy_version
        run: |
          LATEST=$(curl -sL "https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=100" | \
            jq -r '.results[].name' | \
            grep -x -E '[0-9]+\.[0-9]+\.[0-9]+' | \
            sort -V | tail -n 1)
          
          echo "Latest upstream Caddy version is: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Check if we already built this version
        id: check_image
        run: |
          if docker manifest inspect ${{ env.REGISTRY}}/${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }} > /dev/null 2>&1; then
            echo "Image ${{ env.REGISTRY}}/${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }} already exists. Skipping build."
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected. Proceeding to build."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.build_needed == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/riscv64,linux/s390x
      # Pass the target image name (hardcoding since env context isn't available in 'with' block)
      meta-images: ghcr.io/airopi/caddy-l4
      # Map the dynamic tags using Docker's metadata format
      meta-tags: |
        type=raw,value=${{ needs.check-version.outputs.version }}
        type=raw,value=latest
      # Pass the Caddy version as a build argument
      build-args: |
        version=${{ needs.check-version.outputs.version }}
    secrets:
      # Authenticate to GHCR using the built-in GitHub token
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
